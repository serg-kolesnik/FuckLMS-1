name: Android CI

on:
  push:
    branches: [ "master", "dev" ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ "master", "dev" ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий (исправлено на стабильную v4)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраиваем Java (исправлено на стабильную v4)
      - name: Set up SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Настраиваем кэширование Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Определяем тип сборки (dev или release) на основе текущей ветки
      - name: Set Build Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "TAG_PREFIX=v" >> $GITHUB_ENV
          else
            echo "BUILD_TYPE=dev" >> $GITHUB_ENV
            echo "TAG_PREFIX=dev-v" >> $GITHUB_ENV
          fi

      # 5. Автоматически обновляем версию: versionCode = номер запуска workflow.
      - name: Bump versionCode
        run: sed -i -E "s/versionCode = [0-9]+/versionCode = ${{ github.run_number }}/" app/build.gradle.kts

      # 6. Даём права на выполнение и собираем APK
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. Загружаем стандартный собранный APK файл
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.BUILD_TYPE }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Автоматическая публикация в Releases
  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    permissions:
      contents: write # Требуется для создания релиза и загрузки файлов

    steps:
      # 1. Чекаутим код
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Build Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "TAG_PREFIX=v" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            echo "BUILD_TYPE=dev" >> $GITHUB_ENV
            echo "TAG_PREFIX=dev-v" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      # 2. Скачиваем артефакт APK
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-${{ env.BUILD_TYPE }}-apk
          path: app/build/outputs/apk/debug/

      # 3. Переименовываем скачанный файл под нужный формат для релиза
      - name: Rename APK for Release
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-${{ env.BUILD_TYPE }}-${{ github.run_number }}.apk

      # 4. Создаем релиз на GitHub и прикрепляем переименованный APK
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_PREFIX }}1.0.${{ github.run_number }}
          name: "App Build (${{ env.BUILD_TYPE }}) v1.0.${{ github.run_number }}"
          body: "Автоматическая сборка из ветки **${{ github.ref_name }}**.\nТип сборки: `${{ env.BUILD_TYPE }}`\nНомер билда (versionCode): `${{ github.run_number }}`."
          prerelease: ${{ env.IS_PRERELEASE }}
          files: app/build/outputs/apk/debug/app-${{ env.BUILD_TYPE }}-${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
