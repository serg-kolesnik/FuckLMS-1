name: Android CI

on:
  push:
    branches: [ "master", "dev" ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ "master", "dev" ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Настраиваем Java (нужную для Android и Gradle)
      - name: Set up SDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Настраиваем официальное кэширование Grandle для ускорения сборки
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Автоматически обновляем версию: versionCode = номер запуска workflow.
      #    Экшен chkfung/android-version-action удалён с GitHub (404) — заменён на sed.
      - name: Bump versionCode
        run: sed -i -E "s/versionCode = [0-9]+/versionCode = ${{ github.run_number }}/" app/build.gradle.kts

      # 5. Даём права на выполнение и собираем APK
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Выгружаем APK как артефакт — скачивается со страницы запуска workflow
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
