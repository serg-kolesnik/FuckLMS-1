openapi: 3.0.3
info:
  title: FuckLMS Attendance Service API
  description: |
    HTTP contract of the FuckLMS attendance service — a standalone Go service (the `server/`
    directory of this repository) that performs Moodle LMS login and attendance marking on
    behalf of stored students.

    Architecture (see `docs/adr/0001-go-attendance-service.md`):

    - The Android app talks only to this service. It no longer stores student credentials and
      no longer automates Moodle itself: the WebView flow and the on-device account storage
      are removed.
    - The service keeps students in its PostgreSQL database (table `students`) and performs
      the actual Moodle interaction — HTML form login and attendance submission, in parallel
      per student. The Moodle side of the interaction (HTML pages and
      `application/x-www-form-urlencoded` submissions at `https://lms.uni-dubna.ru`) is an
      implementation detail of the service and is described in `docs/network-api.md`.
    - Attendance marking streams per-student results as Server-Sent Events (`text/event-stream`).
    - Passwords are accepted on create/update and are **never** returned in any response.
    - All endpoints except `GET /health` require a static bearer token.
  version: 2.0.0
  contact:
    name: FuckLMS project
    url: https://github.com/slipynil/FuckLMS
servers:
  - url: http://localhost:8080
    description: Local service instance; the real URL is configured in the app settings
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness probes
  - name: Students
    description: CRUD over stored student accounts
  - name: Attendance
    description: Attendance marking with streamed results
paths:
  /health:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: Checks that the HTTP server is up and the PostgreSQL connection responds.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Service is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/students:
    get:
      tags:
        - Students
      summary: List students
      description: |
        Returns all stored students ordered by id. Passwords are never included in responses.
      responses:
        '200':
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Students
      summary: Create a student
      description: |
        Creates a student record. `lmsLogin` must be unique — duplicates are rejected with `409`.
        The password is stored as provided; it is the actual LMS password used later by
        `POST /api/mark`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreate'
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A student with the same `lmsLogin` already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/students/{id}:
    put:
      tags:
        - Students
      summary: Update a student
      description: |
        Updates the given fields. All fields are optional; an omitted `lmsPassword` means
        the password is left unchanged.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdate'
      responses:
        '200':
          description: Updated student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Students
      summary: Delete a student
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '204':
          description: Student deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/mark:
    post:
      tags:
        - Attendance
      summary: Mark attendance for students (SSE stream)
      description: |
        Runs the Moodle login + attendance flow for the requested students in parallel
        (bounded worker pool, default concurrency 5, configurable via environment) and streams
        one `result` event per student as soon as it is ready, followed by a final `done` event.

        Stream format (`text/event-stream`):

        ```
        event: result
        data: {"login":"ivanov","status":"success","message":"Отмечено"}

        event: result
        data: {"login":"petrov","status":"already","message":"Посещаемость уже была отмечена"}

        event: done
        data: {"total":2,"success":1,"already":1,"error":0}
        ```

        - `result` events arrive in arbitrary order (students are processed concurrently).
        - `status`: `success` — the mark was saved; `already` — attendance had been marked
          before (treated as success); `error` — this student failed, the stream continues.
        - Comment lines `: ping` are emitted every ~15 seconds as keep-alive.

        Rules:

        - `qrUrl` must point to `lms.uni-dubna.ru` and contain a `sessid` query parameter;
          the optional QR password is read from `qrpass`, `password`, or `studentpassword`
          (in that priority order).
        - `studentIds` omitted or empty → all students with `isSelected = true` are marked.
        - A client disconnect does not cancel in-flight marks; there is no stream resume in v1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkRequest'
      responses:
        '200':
          description: SSE stream with per-student results and a final summary
          content:
            text/event-stream:
              schema:
                type: string
                description: |-
                  Concatenated SSE events:
                  `event: result` + `data: <MarkResultEvent>` (zero or more),
                  then `event: done` + `data: <MarkSummary>`.
        '400':
          description: |
            Invalid request: missing/foreign `qrUrl`, missing `sessid`, or no students match
            the selection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Static token configured on the service via environment
  parameters:
    StudentId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Student identifier
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Student with the given id does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request body is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Student:
      type: object
      description: Stored student. Never contains a password.
      required:
        - id
        - firstName
        - lastName
        - studyGroup
        - lmsLogin
        - isSelected
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        firstName:
          type: string
          maxLength: 100
          example: Иван
        lastName:
          type: string
          maxLength: 100
          example: Иванов
        studyGroup:
          type: string
          maxLength: 50
          example: 101-А
        lmsLogin:
          type: string
          maxLength: 100
          example: ivanov
        isSelected:
          type: boolean
          description: Whether this student is included when no explicit id list is given
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StudentCreate:
      type: object
      additionalProperties: false
      required:
        - firstName
        - lastName
        - studyGroup
        - lmsLogin
        - lmsPassword
      properties:
        firstName:
          type: string
          maxLength: 100
          example: Иван
        lastName:
          type: string
          maxLength: 100
          example: Иванов
        studyGroup:
          type: string
          maxLength: 50
          example: 101-А
        lmsLogin:
          type: string
          maxLength: 100
          description: LMS (Moodle) login; unique across students
          example: ivanov
        lmsPassword:
          type: string
          format: password
          maxLength: 255
          description: LMS (Moodle) password; stored as provided, never returned
          example: strongPassword123
    StudentUpdate:
      type: object
      additionalProperties: false
      description: All fields optional; omitted `lmsPassword` keeps the current password.
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        studyGroup:
          type: string
          maxLength: 50
        lmsLogin:
          type: string
          maxLength: 100
        lmsPassword:
          type: string
          format: password
          maxLength: 255
        isSelected:
          type: boolean
    MarkRequest:
      type: object
      additionalProperties: false
      required:
        - qrUrl
      properties:
        qrUrl:
          type: string
          format: uri
          description: |
            Raw URL from the scanned QR code. Host must be `lms.uni-dubna.ru`; must contain
            a `sessid` query parameter. Optional QR password is taken from `qrpass`,
            `password`, or `studentpassword`.
          example: https://lms.uni-dubna.ru/mod/attendance/attendance.php?sessid=123456&qrpass=abc123
        studentIds:
          type: array
          items:
            type: integer
            format: int64
          description: Students to mark. Omitted or empty → all students with `isSelected = true`.
          example: [1, 5, 12]
    MarkResultEvent:
      type: object
      description: Payload of one SSE `result` event.
      required:
        - login
        - status
        - message
      properties:
        login:
          type: string
          description: LMS login of the student this result belongs to
          example: ivanov
        status:
          type: string
          enum:
            - success
            - already
            - error
          description: |
            `success` — mark saved; `already` — attendance had been marked before
            (treated as success); `error` — this student failed, the stream continues.
          example: success
        message:
          type: string
          description: Human-readable detail (Russian, as shown in the app)
          example: Отмечено
    MarkSummary:
      type: object
      description: Payload of the final SSE `done` event.
      required:
        - total
        - success
        - already
        - error
      properties:
        total:
          type: integer
          example: 3
        success:
          type: integer
          example: 1
        already:
          type: integer
          example: 1
        error:
          type: integer
          example: 1
    HealthStatus:
      type: object
      required:
        - status
        - database
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          example: ok
        database:
          type: string
          enum:
            - up
            - down
          example: up
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: qrUrl host is not allowed
